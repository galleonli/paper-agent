# =============================================================================
# PAPER INTELLIGENCE AGENT — CONFIGURATION
# Copy to config.yaml and edit. This file is the single source of truth for
# user-customizable behavior.
# All dates (paths, digest, run date, lookback) use system local time only.
# =============================================================================
#
# **********  USER SETTINGS (EDIT HERE)  **********
#
# -----------------------------------------------------------------------------
# Daily limits (catch-up: lookback window + cap per run)
# -----------------------------------------------------------------------------
# Scope of `direction`:
# - lookback_days: global catch-up window for both discovery and Scholar Inbox.
# - max_papers_per_day: discovery only (Scholar Inbox uses sources.scholar_alerts.max_items_per_run).
# - allow/deny/queries/include/exclude rules below: discovery feed only.
direction:
  max_papers_per_day: 15
  lookback_days: 3
  allow_categories: ["cs.LG", "cs.CL"]
  deny_categories: []
  queries: []
  include_keywords: []
  exclude_keywords: []

# -----------------------------------------------------------------------------
# Interest model: seeds only (keyphrases/negative use direction.include_keywords / exclude_keywords)
# -----------------------------------------------------------------------------
interests:
  seeds:
    - "https://arxiv.org/abs/2301.12345"
    - "arXiv:2302.00001"

delivery:
  paper_dir: "/path/to/your/paper/repo"
  state_dir: "./state"
  logs_dir: "./logs"

# -----------------------------------------------------------------------------
# Summarization: single switch (LLM research summary). If enabled, set provider/model/language.
# -----------------------------------------------------------------------------
summarize:
  enabled: true
  provider: "openai"
  model: "gpt-4o-mini"
  language: "en"

# -----------------------------------------------------------------------------
# Export: BibTeX and RIS (EndNote-compatible)
# -----------------------------------------------------------------------------
export:
  formats: [] # ["bibtex", "ris"]

# -----------------------------------------------------------------------------
# Sources: arXiv (discovery) + Scholar Inbox (email only; no RSS, no crawling)
# -----------------------------------------------------------------------------
sources:
  arxiv:
    enabled: true
  # Scholar Inbox: Google Scholar Alerts via email only. Does NOT consume max_papers_per_day;
  # does NOT use bandit/exploration/diversity constraints. Ordering: arrival (email received) only.
  scholar_alerts:
    enabled: false
    mode: "email"                 # only email is implemented for Scholar Alerts
    email:
      provider: "imap"           # mbox | eml_dir | gmail | imap
      imap_host: "imap.gmail.com"
      imap_user: "your_scholar_inbox@gmail.com"
      imap_password_env: "IMAP_PASSWORD"   # env var name for password
      gmail_label: "scholar-alerts"  # mailbox/label to read from for Gmail IMAP
      mbox_path: ""               # path to exported .mbox (when provider=mbox)
      eml_dir: ""                # directory of .eml files (when provider=eml_dir)
      from_addresses: ["scholaralerts-noreply@google.com"]  # optional filter; can be empty []
    max_items_per_run: 200
    ordering: "arrival"          # only arrival for email inbox semantics
    light_filter:
      include_keywords: []
      exclude_keywords: []
    # NOTE: do NOT add count_toward_daily_limit or participate_in_constraints.

# -----------------------------------------------------------------------------
# Feedback (blocked/boosted; used by deterministic policy)
# -----------------------------------------------------------------------------
feedback:
  blocked_phrases: []
  blocked_authors: []
  boosted_phrases: []

# -----------------------------------------------------------------------------
# Selection (agent logic: exploration, topic diversity)
# -----------------------------------------------------------------------------
selection:
  explore_ratio: 0.2
  topic_cap: 3
  min_topics: 1

# -----------------------------------------------------------------------------
# Policy: deterministic (phrase-based) or linucb (bandit: reward + uncertainty + novelty)
# -----------------------------------------------------------------------------
policy:
  type: "linucb"   # or "deterministic"
  # The following LinUCB hyperparameters have sensible defaults and usually do
  # not need to be changed. If you really want to tune them, see
  # docs/agent-logic.md and docs/autotune-design.md and set them explicitly:
  #
  # alpha: 0.5              # LinUCB uncertainty scale
  # lambda_ucb: 1.0         # weight for uncertainty in selection score
  # mu_novelty: 0.3         # weight for novelty in selection score
  # ridge: 1.0              # ridge regularization for LinUCB

# -----------------------------------------------------------------------------
# AutoTune (optional meta-controller for policy hyperparameters)
# -----------------------------------------------------------------------------
# Most users can ignore this section. AutoTune is an optional bandit
# meta-controller for automatically tuning policy.* hyperparameters. It is
# disabled by default. If you want to experiment, uncomment and edit carefully.
#
# autotune:
#   enabled: false
#   method: "thompson"      # "thompson" | "off"
#   schedule:
#     daily_hour_utc: 23
#     weekly_day_of_week: "sun"   # "mon".."sun"
#   candidates:
#     - id: "baseline"
#       alpha: 0.5
#       lambda_ucb: 1.0
#       mu_novelty: 0.3
#       ridge: 1.0
#   reward:
#     signals:
#       click: 0.2
#       open_note: 0.5
#       star: 1.0
#       export: 1.5
#       skip: -0.05
#       mute: -2.0
#     diversity:
#       num_topics: 0.1
#       exploration_picks: 0.05
#       avg_novelty: 0.2
#   guardrails:
#     max_daily_delta_reward: -5.0
#     rollback_days: 3
#     allowed_ranges:
#       alpha: [0.0, 5.0]
#       lambda_ucb: [0.0, 5.0]
#       mu_novelty: [0.0, 5.0]
#       ridge: [0.01, 100.0]

# -----------------------------------------------------------------------------
# ADVANCED (less often changed)
# -----------------------------------------------------------------------------
advanced:
  request_timeout_seconds: 30
  max_retries: 3
  max_results_per_query: 100

# -----------------------------------------------------------------------------
# Optional prompt overrides (advanced; omit to use built-in defaults)
# Put long templates at the end to keep the main settings readable.
# -----------------------------------------------------------------------------
prompts:
  research_summary_template: |
    You are a research assistant for machine learning papers.
    Read the following paper metadata and produce a concise, structured summary
    for a researcher. Answer strictly in {language_name}.

    Paper metadata:
    - Title: {paper_title}
    - Abstract: {paper_summary}
    - Authors: {paper_authors}
    - Categories: {paper_categories}
    - arXiv ID: {paper_id}
    - arXiv URL: {paper_link_abs}
    - Matched keyphrases (user interests): {keyphrases}
    - Direction include_keywords: {include_kw}
    - Existing why_this_paper (selection rationale): {why_text}

    Please output the summary in plain text with the following numbered sections:

    1. Subfield and problem definition
    - State the specific research subfield this paper belongs to.
    - Give a 1-2 sentence precise definition of the main problem being addressed.

    2. Motivation
    - List 1-3 concrete limitations of existing work that the paper highlights.
    - Explain what property or metric the paper aims to improve.

    3. What the paper claims to solve
    - Summarize 2-4 main contributions, each as "problem -> idea" if possible.
    - Clarify whether contributions are about data, model architecture, training strategy, inference strategy, or evaluation protocol.

    4. Method overview (high level)
    - Describe the core method as 3-6 ordered steps.
    - Highlight the 1-2 design choices that most directly address the motivation.

    5. Relevance for the user
    - In 1-2 sentences, explain why this paper could be useful for someone interested in the user's keyphrases and queries.

    If the metadata is insufficient to answer a specific bullet reliably, explicitly say
    "Information insufficient to judge" for that bullet instead of guessing.
