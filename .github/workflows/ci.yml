name: Core checks and packages

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install zsh for runner regression tests
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          OPENAI_API_KEY: ""
          IMAP_PASSWORD: ""

  package:
    name: Build and verify package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the built wheel
        run: python -m pip install dist/*.whl
      - name: Audit runtime dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt --strict
      - name: Verify the installed CLI outside the source checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m paper_agent --help
          paper-agent --help
      - name: Verify bootstrap preserves an existing environment and config
        run: |
          python -m venv .venv
          touch .venv/preserve-existing-environment
          cp config.example.yaml config.yaml
          cp config.yaml "$RUNNER_TEMP/bootstrap-config.yaml"
          ./scripts/bootstrap.sh
          cmp config.yaml "$RUNNER_TEMP/bootstrap-config.yaml"
          test -f .venv/preserve-existing-environment
          .venv/bin/paper-agent --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-agent-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release source and version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag does not match the package version")
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          notes = changelog.split(f"## [{version}]", 1)[1].split("\n", 1)[1].split("\n## ", 1)[0]
          pathlib.Path("release-notes.md").write_text(notes.strip() + "\n")
          PY
      - name: Download tested distributions
        run: gh run download "$GITHUB_RUN_ID" --name "paper-agent-$GITHUB_SHA" --dir dist
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Publish release and assets
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Paper Agent $RELEASE_TAG" --notes-file release-notes.md
